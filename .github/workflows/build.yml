name: Build ClipDL.exe

on:
  push:
    tags: ["v*"]        # git tag v1.0 && git push --tags  -> release avec l'exe
  workflow_dispatch:    # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --name ClipDL
          --add-data "templates;templates"
          --collect-all yt_dlp --collect-all yt_dlp_ejs
          --collect-data imageio_ffmpeg app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClipDL-windows
          path: dist/ClipDL.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipDL.exe
